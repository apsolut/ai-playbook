# Cloudflare Workers static assets — VitePress site. No Worker script, no bindings, no secrets.
#
# Workers Builds (this repo is a Worker, not a Pages project):
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
#   Root directory:  /
#   Node version:    20+
#
# [assets].directory is the VitePress output. html_handling = "auto-trailing-slash"
# matches cleanUrls: file.html is served at /file, and section/index.html at /section/.
# not_found_handling = "404-page" serves the nearest 404.html (VitePress emits one).
# Do not set pages_build_output_dir — that makes `wrangler deploy` treat this as Pages.

name = "apsolut-ai-playbook"
compatibility_date = "2025-01-01"

[assets]
directory = "./docs/.vitepress/dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
